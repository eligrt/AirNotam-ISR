name: Scrape NOTAMs

on:
  schedule:
    # GitHub throttles tight schedules; */15 was effectively running ~2h anyway.
    # Set an honest 2h cadence. Trigger manually via workflow_dispatch when needed.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: |
          node --input-type=module <<'SCRAPER_EOF'
          /**
           * AirNotam scraper (mobile endpoints) — fetches Israeli NOTAMs from the official
           * IAA Mobile AeroInfo pages, which serve plain server-rendered HTML with no bot-wall
           * on the data (unlike the desktop ext.iaa.gov.il site).
           *
           * Flow:
           *   1. GET maiNotam.aspx           -> list page, extract (rowID, notamId) pairs
           *   2. GET maiDetails.aspx?rowID=  -> full Q/A/B/C/E text per NOTAM
           *   3. parse -> write ../notams.json
           *
           * No headless browser needed — plain HTTP. Runs the same locally and in CI.
           *   node scrape.mjs
           */
          
          import { writeFileSync } from "fs";
          import { join } from "path";
          
          const OUT = join(process.cwd(), "notams.json");
          const BASE = "https://brin.iaa.gov.il/MobileAeroinfo/";
          const LIST_URL = BASE + "maiNotam.aspx";
          const DETAIL_URL = id => `${BASE}maiDetails.aspx?rowID=${id}&scrpos=0&mode=notam`;
          
          const UA = "Mozilla/5.0 (Linux; Android 13; SM-S911B) AppleWebKit/537.36 " +
                     "(KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36";
          const HEADERS = { "User-Agent": UA, "Accept-Language": "en-US,en;q=0.9,he;q=0.8" };
          const DETAIL_DELAY_MS = 150;
          const MAX_RETRIES = 3;
          
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          
          async function fetchText(url, attempt = 1) {
            try {
              const res = await fetch(url, { headers: HEADERS });
              if (!res.ok) throw new Error("HTTP " + res.status);
              const txt = await res.text();
              if (/radware|perfdrive|captcha|are you a bot/i.test(txt) && !/NOTAM/.test(txt)) {
                throw new Error("blocked by bot-wall");
              }
              return txt;
            } catch (e) {
              if (attempt < MAX_RETRIES) { await sleep(500 * attempt); return fetchText(url, attempt + 1); }
              throw e;
            }
          }
          
          function parseList(html) {
            // The server sends XHTML where apostrophes in onclick are encoded as &#39;
            // (browsers show them as ' but the raw bytes are the entity). Accept both.
            const ids = [...html.matchAll(/rowClicked\((?:'|&#39;|&apos;)(\d+)(?:'|&#39;|&apos;)\)/g)].map(m => m[1]);
            const notamNumbers = [...html.matchAll(/class="DivRecordID">\s*([A-Z]\d{4}\/\d{2})/g)].map(m => m[1]);
            const rows = [];
            const n = Math.min(ids.length, notamNumbers.length);
            for (let i = 0; i < n; i++) rows.push({ rowID: ids[i], id: notamNumbers[i] });
            return rows;
          }
          
          function parseQ(qText) {
            const m = qText.match(/([A-Z]{4})\/([A-Z]{5})\/([A-Z]+)\/([A-Z]+)\s*\/([A-Z]+)\s*\/(\d{3})\/(\d{3})\/(\d{4}[NS]\d{5}[EW])(\d{3})?/);
            if (!m) return null;
            const [, fir, qcode, traffic, purpose, scope, lo, up, pos, rad] = m;
            return { fir, qcode, traffic, purpose, scope, lowerLimitFl: lo, upperLimitFl: up,
                     position: parseCoord(pos, rad ? parseInt(rad, 10) : null) };
          }
          function parseCoord(token, radiusNm) {
            const m = token.match(/(\d{2})(\d{2})([NS])(\d{3})(\d{2})([EW])/);
            if (!m) return null;
            let lat = +m[1] + +m[2] / 60; if (m[3] === "S") lat = -lat;
            let lon = +m[4] + +m[5] / 60; if (m[6] === "W") lon = -lon;
            return { lat: +lat.toFixed(6), lon: +lon.toFixed(6), radiusNm, source: "q_line" };
          }
          function parseTimes(text) {
            const b = text.match(/\bB\)\s*(\d{10})/), c = text.match(/\bC\)\s*(\d{10}|PERM)/i);
            const toISO = s => { if (!s || /perm/i.test(s)) return null;
              return new Date(Date.UTC(2000 + +s.slice(0,2), +s.slice(2,4)-1, +s.slice(4,6), +s.slice(6,8), +s.slice(8,10))).toISOString(); };
            return { fromDate: b ? toISO(b[1]) : null, toDate: c ? (/perm/i.test(c[1]) ? null : toISO(c[1])) : null };
          }
          
          function decodeEntities(s) {
            return s
              .replace(/&#39;/g, "'").replace(/&apos;/g, "'")
              .replace(/&quot;/g, '"').replace(/&amp;/g, "&")
              .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
              .replace(/&nbsp;/g, " ");
          }
          
          function parseDetail(html, fallbackId) {
            const text = decodeEntities(html
              .replace(/<style[\s\S]*?<\/style>/gi, "")
              .replace(/<script[\s\S]*?<\/script>/gi, "")
              .replace(/<[^>]+>/g, " "))
              .replace(/\s+/g, " ")
              .trim();
          
            const idm = text.match(/\(?([A-Z]\d{4}\/\d{2})\s+NOTAM([NRC])(?:\s+([A-Z]\d{4}\/\d{2}))?/);
            const id = idm ? idm[1] : fallbackId;
            const notamType = idm ? idm[2] : null;
            const replaces = idm && idm[3] ? idm[3] : null;
          
            const qm = text.match(/Q\)\s*(.+?)\s*A\)/);
            const qLine = qm ? parseQ(qm[1]) : null;
          
            const am = text.match(/A\)\s*([A-Z]{4})/);
            const location = am ? am[1] : null;
          
            const locDesc = (text.match(/Location Description:\s*(.+?)\s*Created:/) || [])[1] || null;
          
            const em = text.match(/E\)\s*(.*?)\s*$/);
            const eText = em ? em[1].replace(/\)\s*$/, "").trim() : "";
          
            const times = parseTimes(text);
            const administrative = /CHECKLIST|TRIGGER NOTAM/i.test(eText);
          
            const rawMatch = text.match(/\(([A-Z]\d{4}\/\d{2}\s+NOTAM[\s\S]*)$/);
            const rawText = rawMatch ? rawMatch[1].trim() : "";
          
            return { id, location, locationDescription: locDesc, ...times, qLine, eText,
                     position: qLine?.position || null, administrative, notamType, replaces, rawText };
          }
          
          async function main() {
            const generatedAt = new Date().toISOString();
            console.error("Fetching list page…");
            const listHtml = await fetchText(LIST_URL);
            const rows = parseList(listHtml);
            console.error(`Found ${rows.length} NOTAMs in list.`);
            if (!rows.length) {
              // Diagnostics: show what we actually received
              console.error(`--- DIAGNOSTICS ---`);
              console.error(`list page length: ${listHtml.length} chars`);
              console.error(`rowClicked count (entity-aware): ${(listHtml.match(/rowClicked\((?:'|&#39;|&apos;)\d+/g) || []).length}`);
              console.error(`DivRecordID count: ${(listHtml.match(/class="DivRecordID">/g) || []).length}`);
              console.error(`--- END DIAGNOSTICS ---`);
              throw new Error("No rows parsed from list page — see diagnostics above.");
            }
          
            const notams = [];
            for (let i = 0; i < rows.length; i++) {
              const { rowID, id } = rows[i];
              try {
                const html = await fetchText(DETAIL_URL(rowID));
                const n = parseDetail(html, id);
                n.rowID = rowID;
                notams.push(n);
                if ((i + 1) % 20 === 0) console.error(`  …${i + 1}/${rows.length}`);
              } catch (e) {
                console.error(`  ! ${id} (row ${rowID}) failed: ${e.message}`);
                notams.push({ id, rowID, eText: "", detailError: e.message });
              }
              await sleep(DETAIL_DELAY_MS);
            }
          
            const payload = {
              generatedAt,
              source: LIST_URL,
              disclaimer: "Informational only. Not a substitute for an official pre-flight briefing.",
              count: notams.length,
              notams
            };
            writeFileSync(OUT, JSON.stringify(payload, null, 2), "utf-8");
            console.error(`✓ Wrote ${notams.length} NOTAMs → ${OUT}`);
          }
          
          main().catch(err => { console.error("✗ Scrape failed:", err.message); process.exit(1); });
          SCRAPER_EOF

      - name: Commit if changed
        run: |
          git config user.name  "airnotam-bot"
          git config user.email "airnotam-bot@users.noreply.github.com"
          git add notams.json
          if git diff --staged --quiet; then
            echo "No change in notams.json"
          else
            git commit -m "data: refresh notams.json [skip ci]"
            git push
          fi
