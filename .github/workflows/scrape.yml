name: Scrape NOTAMs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: airnotam-scraper
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: airnotam-scraper
        run: node scrape.mjs

      - name: Commit if changed
        run: |
          git config user.name  "airnotam-bot"
          git config user.email "airnotam-bot@users.noreply.github.com"
          git add notams.json
          if git diff --staged --quiet; then
            echo "No change in notams.json"
          else
            git commit -m "data: refresh notams.json [skip ci]"
            git push
          fi
