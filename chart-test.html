<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chart test v1.00.003</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%;background:#111;font-family:-apple-system,system-ui,sans-serif;color:#eee}
  #map{position:absolute;inset:0}
  #bar{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:rgba(20,20,24,.92);padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:14px}
  #bar .row{display:flex;align-items:center;gap:10px;margin:4px 0}
  #bar input[type=range]{flex:1;height:32px}
  button{font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid #666;background:#2a2a30;color:#fff}
  button.main{background:#1f6feb;border-color:#1f6feb}
  #stat{font-size:12px;color:#9ab;white-space:pre-wrap;line-height:1.35}
  #load{position:absolute;inset:0;z-index:1100;background:rgba(10,10,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
  #load.on{display:flex}
  #load h2{margin:0;font-size:20px}
  #prog{width:80%;max-width:360px;height:10px;display:none}
  .gdot{background:#e11;border:1px solid #fff;border-radius:50%;width:8px;height:8px;margin:-4px 0 0 -4px}
  .glab{background:rgba(255,255,255,.85);color:#900;border:0;box-shadow:none;font-size:11px;padding:0 3px}
  #logbox{position:absolute;inset:0;z-index:1200;background:#0b0b0e;display:none;flex-direction:column;padding:10px;gap:8px}
  #logbox.on{display:flex}
  #logbox textarea{flex:1;background:#000;color:#9f9;font:11px/1.35 ui-monospace,monospace;border:1px solid #444;border-radius:6px;padding:6px}
  label{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div id="map"></div>

<div id="load">
  <h2>Sport chart tiles</h2>
  <div id="loadmsg">No chart stored on this device yet.<br>Pick the zip file (sport-tiles.zip).</div>
  <input id="file" type="file" accept=".zip,application/zip,application/x-zip-compressed" style="display:none">
  <button class="main" id="pick">Choose zip file</button>
  <progress id="prog" value="0" max="100"></progress>
</div>

<div id="logbox"><div id="logmsg" style="font-size:13px">Log copied. If paste does not work, long-press the text, Select All, Copy.</div><textarea id="logta" readonly></textarea><div style="display:flex;gap:10px"><button class="main" id="logcopy">Copy again</button><button id="logclear">Clear log</button><button id="logclose">Close</button></div></div>

<div id="bar">
  <div class="row"><span style="width:92px">Chart opacity</span><input id="op" type="range" min="0" max="100" value="70"><span id="opv" style="width:38px;text-align:right">70%</span></div>
  <div class="row">
    <label><input id="gis" type="checkbox"> GIS points</label>
    <button id="osmbtn">Base: Street</button>
    <button id="repick">Reload zip</button>
    <button id="clear">Clear</button>
    <button id="stress">Stress</button>
    <button id="logbtn">Log</button>
  </div>
  <div id="stat"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
var VER='v1.00.003';
var DB_NAME='chartTestDB', STORE='tiles';
var GIS_URL='gis/sport.json';

/* ---------- admin log (same idea as the main app: last 300 events kept on the device) ---------- */
var ALOG_KEY='charttest_alog', ALOG_MAX=300, ALOG=[];
try{ ALOG=JSON.parse(localStorage.getItem(ALOG_KEY)||'[]')||[]; }catch(e){ ALOG=[]; }
function p2(n){ return String(n).padStart(2,'0'); }
function alog(t){
  var d=new Date();
  ALOG.push(p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+' '+t);
  if(ALOG.length>ALOG_MAX) ALOG=ALOG.slice(-ALOG_MAX);
  try{ localStorage.setItem(ALOG_KEY,JSON.stringify(ALOG)); }catch(e){}
}
function logText(){ return 'chart-test '+VER+' log, '+new Date().toISOString()+'\n'+ALOG.join('\n'); }
window.addEventListener('error',function(e){ alog('ERROR '+(e.message||'')+' @'+(e.lineno||'')); });
window.addEventListener('unhandledrejection',function(e){ alog('ERROR (promise) '+((e.reason&&(e.reason.name+': '+e.reason.message))||e.reason||'')); });
(function(){
  var prev=null; try{ prev=localStorage.getItem('charttest_alive'); }catch(e){}
  alog('START '+VER+' - previous session: '+(prev==='1'?'CUT OFF while visible (crash / forced reload)':prev==='h'?'ended in background':'ended normally'));
  alog('device: '+navigator.userAgent.replace(/\s+/g,' ').slice(0,110)+' · '+innerWidth+'x'+innerHeight+' dpr '+(window.devicePixelRatio||1));
  var set=function(v){ try{ localStorage.setItem('charttest_alive',v); }catch(e){} }, closed=false;
  set('1');
  document.addEventListener('visibilitychange',function(){
    if(closed) return; var h=document.visibilityState==='hidden'; set(h?'h':'1'); alog(h?'app hidden':'app visible');
    if(!h){ dbReset('visible'); setTimeout(function(){ memSnap('visible'); chartHealth('visible'); },1500); }
  });
  window.addEventListener('pagehide',function(){ closed=true; set('0'); alog('page closed'); });
  window.addEventListener('pageshow',function(e){ if(e.persisted){ closed=false; set('1'); alog('page restored (bfcache)'); dbReset('pageshow'); } });
})();

/* ---------- IndexedDB (own storage; nothing leaves the device) ----------
   v1.00.003: iOS can close the database connection behind the page's back (memory pressure, background).
   The old code kept the dead connection for ever, so every tile came back empty. Now: reopen and retry once. */
var dbp=null, DBERR=0, DBREOPEN=0;
function dbReset(why){ if(dbp){ dbp=null; DBREOPEN++; alog('db handle dropped ('+why+'), will reopen'); } }
function db(){
  if(dbp) return dbp;
  var me=dbp=new Promise(function(res,rej){
    var r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); };
    r.onsuccess=function(){
      var d=r.result;
      d.onclose=function(){ if(dbp===me) dbReset('connection closed by browser'); };
      d.onversionchange=function(){ d.close(); if(dbp===me) dbReset('versionchange'); };
      res(d);
    };
    r.onerror=function(){ if(dbp===me) dbp=null; alog('db open ERROR '+(r.error&&r.error.name)); rej(r.error); };
    r.onblocked=function(){ alog('db open blocked'); };
  });
  return me;
}
/* run fn(db) -> promise; on any failure drop the connection and try once more */
function withDb(fn){
  return db().then(fn).catch(function(e){
    DBERR++; alog('db op failed ('+(e&&e.name)+': '+(e&&e.message)+'), retrying');
    dbp=null; return db().then(fn);
  });
}
function dbGet(key){
  return withDb(function(d){ return new Promise(function(res,rej){
    var q=d.transaction(STORE).objectStore(STORE).get(key);
    q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); };
  });});
}
function dbPutMany(items){
  return withDb(function(d){ return new Promise(function(res,rej){
    var t=d.transaction(STORE,'readwrite'), s=t.objectStore(STORE);
    items.forEach(function(it){ s.put(it[1],it[0]); });
    t.oncomplete=function(){ res(); }; t.onerror=function(){ rej(t.error); }; t.onabort=function(){ rej(t.error); };
  });});
}
function dbCount(){
  return withDb(function(d){ return new Promise(function(res,rej){
    var q=d.transaction(STORE).objectStore(STORE).count(); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); };
  });}).catch(function(){ return -1; });
}
function dbClear(){
  return withDb(function(d){ return new Promise(function(res){
    var t=d.transaction(STORE,'readwrite'); t.objectStore(STORE).clear(); t.oncomplete=function(){ res(); };
  });});
}

/* ---------- minimal zip reader (tiles are stored without compression) ---------- */
function u16(v,o){ return v.getUint16(o,true); }
function u32(v,o){ return v.getUint32(o,true); }
function readZip(file,onProgress){
  var size=file.size, tailLen=Math.min(size,66000);
  return file.slice(size-tailLen,size).arrayBuffer().then(function(tb){
    var v=new DataView(tb), eocd=-1;
    for(var i=tb.byteLength-22;i>=0;i--){ if(u32(v,i)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw new Error('This does not look like a zip file');
    var total=u16(v,eocd+10), cdSize=u32(v,eocd+12), cdOff=u32(v,eocd+16);
    if(total===0xffff||cdOff===0xffffffff) throw new Error('Zip64 zip files are not supported here');
    return file.slice(cdOff,cdOff+cdSize).arrayBuffer().then(function(cb){
      var cv=new DataView(cb), p=0, entries=[];
      while(p+46<=cb.byteLength && u32(cv,p)===0x02014b50){
        var method=u16(cv,p+10), csize=u32(cv,p+20), usize=u32(cv,p+24), nl=u16(cv,p+28), el=u16(cv,p+30), cl=u16(cv,p+32), lho=u32(cv,p+42);
        var name=new TextDecoder().decode(new Uint8Array(cb,p+46,nl));
        entries.push({name:name,method:method,csize:csize,usize:usize,lho:lho});
        p+=46+nl+el+cl;
      }
      return entries;
    });
  });
}
function readEntry(file,e){
  return file.slice(e.lho,e.lho+30).arrayBuffer().then(function(hb){
    var h=new DataView(hb), nl=u16(h,26), el=u16(h,28), start=e.lho+30+nl+el;
    return file.slice(start,start+e.csize,'image/webp');
  });
}
function importZip(file){
  var msg=document.getElementById('loadmsg'), prog=document.getElementById('prog');
  prog.style.display='block'; prog.value=0;
  msg.textContent='Reading the zip...';
  return readZip(file).then(function(entries){
    var tiles=entries.filter(function(e){ return /(^|\/)(\d+)\/(\d+)\/(\d+)\.webp$/i.test(e.name); });
    if(!tiles.length) throw new Error('No tiles (z/x/y.webp) found in this zip');
    if(tiles.some(function(e){ return e.method!==0; })) throw new Error('This zip is compressed; it needs to be a "stored" zip');
    msg.textContent='Saving '+tiles.length+' tiles on this device...';
    var i=0, BATCH=60;
    function step(){
      if(i>=tiles.length) return Promise.resolve();
      var part=tiles.slice(i,i+BATCH);
      return Promise.all(part.map(function(e){
        var m=e.name.match(/(\d+)\/(\d+)\/(\d+)\.webp$/i);
        return readEntry(file,e).then(function(b){ return [m[1]+'/'+m[2]+'/'+m[3],b]; });
      })).then(dbPutMany).then(function(){
        i+=BATCH; prog.value=Math.min(100,Math.round(i/tiles.length*100)); return step();
      });
    }
    return step().then(function(){ return tiles.length; });
  });
}

/* ---------- map ---------- */
var map=L.map('map',{zoomControl:true,minZoom:6,maxZoom:15,zoomSnap:1}).setView([32.0,35.0],8);
var BASES=[
  {n:'Street (Esri)',l:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'})},
  {n:'OSM',l:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'})},
  {n:'Carto',l:L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap, &copy; CARTO'})},
  {n:'Satellite (Esri)',l:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'})},
  {n:'off',l:null}
];
var bi=0; BASES[0].l.addTo(map);

var live={}, liveN=0;   /* object URLs currently alive, so they can be released again */
var TL={req:0,ok:0,miss:0,fail:0,imgerr:0}, TLALL={req:0,ok:0,miss:0,fail:0,imgerr:0}, TLT=Date.now(), FAILLOG=0;
function tc(k){ TL[k]++; TLALL[k]++; }
var ChartLayer=L.TileLayer.extend({
  createTile:function(coords,done){
    var img=document.createElement('img'); img.alt=''; img.setAttribute('role','presentation');
    var key=coords.z+'/'+coords.x+'/'+coords.y; tc('req');
    var finished=false, fin=function(e){ if(finished) return; finished=true; done(e,img); };
    dbGet(key).then(function(blob){
      if(!blob){ tc('miss'); fin(null); return; }   /* a miss is normal for blank (white) areas of the chart */
      var url=URL.createObjectURL(blob); live[url]=1; liveN++;
      var rel=function(){ if(live[url]){ URL.revokeObjectURL(url); delete live[url]; liveN--; } };
      img.onload=function(){ tc('ok'); rel(); fin(null); };
      img.onerror=function(){ tc('imgerr'); if(FAILLOG++<15) alog('tile image decode ERROR '+key+' ('+(blob.size||0)+' B)'); rel(); fin(null); };
      img.src=url;
    }).catch(function(e){
      tc('fail'); if(FAILLOG++<15) alog('tile read FAILED '+key+' '+(e&&e.name)+': '+(e&&e.message)); fin(null);
    });
    return img;
  }
});
var chart=new ChartLayer('',{minZoom:7,maxNativeZoom:12,maxZoom:15,opacity:0.7,updateWhenZooming:false,keepBuffer:1,tileSize:256}).addTo(map);

/* ---------- GIS points (to see whether they fall inside the printed triangles) ---------- */
var gisLayer=L.layerGroup(), gisLoaded=false;
function loadGis(){
  if(gisLoaded) return; gisLoaded=true;
  fetch(GIS_URL).then(function(r){ return r.json(); }).then(function(j){
    (j.p.features||[]).forEach(function(f){
      var c=f.geometry.coordinates, ll=[c[1],c[0]];
      L.marker(ll,{icon:L.divIcon({className:'gdot',iconSize:[8,8]}),interactive:false,keyboard:false})
        .bindTooltip(f.properties.c||'',{permanent:true,direction:'right',offset:[6,0],className:'glab'}).addTo(gisLayer);
    });
  }).catch(function(e){ gisLoaded=false; alert('GIS points could not be loaded: '+e.message); });
}
document.getElementById('gis').onchange=function(){
  alog('GIS points '+(this.checked?'on':'off'));
  if(this.checked){ loadGis(); gisLayer.addTo(map); } else map.removeLayer(gisLayer);
};

/* ---------- controls ---------- */
var op=document.getElementById('op'), opv=document.getElementById('opv');
var opT=null;
op.oninput=function(){ chart.setOpacity(op.value/100); opv.textContent=op.value+'%'; clearTimeout(opT); opT=setTimeout(function(){ alog('opacity '+op.value+'%'); },600); };
document.getElementById('osmbtn').onclick=function(){
  if(BASES[bi].l) map.removeLayer(BASES[bi].l);
  bi=(bi+1)%BASES.length;
  if(BASES[bi].l) BASES[bi].l.addTo(map).bringToBack();
  this.textContent='Base: '+BASES[bi].n; alog('base '+BASES[bi].n);
};
var fileIn=document.getElementById('file');
document.getElementById('pick').onclick=function(){ fileIn.click(); };
document.getElementById('repick').onclick=function(){ document.getElementById('load').classList.add('on'); };
document.getElementById('clear').onclick=function(){
  if(!confirm('Delete the stored chart tiles from this device?')) return;
  dbClear().then(function(){ chart.redraw(); showLoad('No chart stored on this device yet.<br>Pick the zip file (sport-tiles.zip).'); upd(); });
};
function showLoad(html){ document.getElementById('loadmsg').innerHTML=html; document.getElementById('prog').style.display='none'; document.getElementById('load').classList.add('on'); }
fileIn.onchange=function(){
  var f=fileIn.files&&fileIn.files[0]; if(!f) return;
  alog('zip picked: '+f.name+' '+Math.round(f.size/1048576)+' MB');
  importZip(f).then(function(n){
    alog('zip imported: '+n+' tiles');
    document.getElementById('load').classList.remove('on'); chart.redraw(); upd();
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
  }).catch(function(e){ alog('zip import FAILED '+(e&&e.message)); showLoad('<b>Failed:</b> '+(e&&e.message?e.message:e)+'<br>Try again.'); });
  fileIn.value='';
};

/* ---------- status line, memory snapshots, health check ---------- */
var COUNT0=null;
function snapText(tag,r){
  var imgs=document.querySelectorAll('#map img.leaflet-tile').length, cimgs=document.querySelectorAll("#map .leaflet-layer img.leaflet-tile[src^=\"blob:\"]").length;
  var secs=Math.max(1,Math.round((Date.now()-TLT)/1000));
  var heap=(performance&&performance.memory)?(' · heap '+Math.round(performance.memory.usedJSHeapSize/1048576)+'MB'):'';
  var us=r&&r[1]&&r[1].usage?(' · storage '+Math.round(r[1].usage/1048576)+'MB'):'';
  return 'mem '+tag+' · stored '+(r?r[0]:'?')+us+heap+' · Z'+map.getZoom()+' · tile img '+imgs+' (chart '+cimgs+') · links alive '+liveN+
    ' · chart tiles in '+secs+'s: req '+TL.req+' ok '+TL.ok+' blank '+TL.miss+' fail '+TL.fail+' decodeErr '+TL.imgerr+
    ' · total ok '+TLALL.ok+' fail '+(TLALL.fail+TLALL.imgerr)+' · dbRetry '+DBERR+' reopen '+DBREOPEN+' · opacity '+op.value+'%';
}
function getStat(){
  return Promise.all([dbCount(), (navigator.storage&&navigator.storage.estimate)?navigator.storage.estimate().catch(function(){return {};}):Promise.resolve({})]).then(function(r){ return [r[0],r[1]]; });
}
function upd(){
  getStat().then(function(r){
    var imgs=document.querySelectorAll('#map img.leaflet-tile').length;
    var heap=(performance&&performance.memory)?(' · JS heap '+Math.round(performance.memory.usedJSHeapSize/1048576)+' MB'):'';
    var q=r[1]&&r[1].usage?(' · site storage '+Math.round(r[1].usage/1048576)+' MB'):'';
    document.getElementById('stat').textContent=VER+' · stored tiles '+r[0]+q+'\nZ'+map.getZoom()+' · tile images on page '+imgs+' · temp picture links alive '+liveN+heap+'\nchart tiles ok '+TLALL.ok+' · failed '+(TLALL.fail+TLALL.imgerr)+' · db retries '+DBERR+' · log lines '+ALOG.length;
  });
}
function memSnap(tag){
  getStat().then(function(r){
    alog(snapText(tag,r));
    TL={req:0,ok:0,miss:0,fail:0,imgerr:0}; TLT=Date.now();
    if(COUNT0===null&&r[0]>0) COUNT0=r[0];
    if(COUNT0!==null&&r[0]!==COUNT0) alog('WARNING stored tile count changed: was '+COUNT0+', now '+r[0]+(r[0]<COUNT0?' (browser may have cleared storage)':''));
  });
}
/* is the chart actually on screen? after a zoom/pan settles, the view should hold some decoded chart images */
function chartHealth(tag){
  var n=document.querySelectorAll('#map img.leaflet-tile[src^="blob:"]').length;
  var shown=0; document.querySelectorAll('#map .leaflet-tile-pane img').forEach(function(i){ if(i.naturalWidth>0&&i.currentSrc) shown++; });
  alog('chart check '+tag+' · Z'+map.getZoom()+' · decoded images in tile pane '+shown+' · requests since last snapshot '+TL.req);
}
map.on('zoomstart',function(){ alog('zoomstart from Z'+map.getZoom()); });
map.on('zoomend',function(){ alog('zoomend Z'+map.getZoom()+' '+map.getCenter().lat.toFixed(3)+','+map.getCenter().lng.toFixed(3)); });
var mvT=null; map.on('moveend',function(){ upd(); clearTimeout(mvT); mvT=setTimeout(function(){ alog('view Z'+map.getZoom()+' '+map.getCenter().lat.toFixed(3)+','+map.getCenter().lng.toFixed(3)); },800); });
map.on('zoomend',upd);
chart.on('tileerror',function(e){ alog('leaflet tileerror'); });
setInterval(upd,2000);
setInterval(function(){ if(document.visibilityState!=='hidden') memSnap('10s'); },10000);

/* ---------- stress test (like the main app): the map glides by itself Z9 -> Z12 around the chart, one move every 1.2 s ---------- */
var ST={on:false,i:0,t:null};
var ST_PTS=[[32.08,34.80],[32.30,34.87],[32.50,34.95],[32.60,35.25],[32.40,35.05],[32.15,34.85],[31.8,34.8],[30.9,34.9]];
var ST_Z=[9,10,11,12,11,10];
function stStep(){
  if(!ST.on) return;
  if(document.visibilityState!=='hidden'){
    var pt=ST_PTS[ST.i%ST_PTS.length], z=ST_Z[ST.i%ST_Z.length]; ST.i++;
    map.setView(pt,z,{animate:true});
  }
  ST.t=setTimeout(stStep,1200);
}
document.getElementById('stress').onclick=function(){
  ST.on=!ST.on; this.textContent=ST.on?'Stop stress':'Stress'; alog('stress test '+(ST.on?'START':'STOP')+' (moves so far '+ST.i+')');
  if(ST.on) stStep(); else clearTimeout(ST.t);
};

/* ---------- log screen ---------- */
function logCopy(){
  var txt=logText(), ta=document.getElementById('logta'); ta.value=txt;
  var ok=false;
  try{ navigator.clipboard.writeText(txt).then(function(){},function(){}); ok=true; }catch(e){}
  if(!ok){ try{ ta.select(); ok=document.execCommand('copy'); }catch(e){} }
  document.getElementById('logmsg').textContent=ok?'Log copied. If paste does not work, long-press the text, Select All, Copy.':'Long-press the text, Select All, Copy.';
}
document.getElementById('logbtn').onclick=function(){ alog('log opened'); document.getElementById('logbox').classList.add('on'); logCopy(); var ta=document.getElementById('logta'); ta.scrollTop=ta.scrollHeight; };
document.getElementById('logcopy').onclick=logCopy;
document.getElementById('logclose').onclick=function(){ document.getElementById('logbox').classList.remove('on'); };
document.getElementById('logclear').onclick=function(){ ALOG=[]; try{ localStorage.removeItem(ALOG_KEY); }catch(e){} alog('log cleared'); logCopy(); };

/* ---------- start ---------- */
dbCount().then(function(n){
  alog('stored tiles at start: '+n);
  if(n===0) showLoad('No chart stored on this device yet.<br>Pick the zip file (sport-tiles.zip).');
  upd(); setTimeout(function(){ memSnap('start'); },2500);
});
window.__test={chart:chart,map:map,importZip:importZip,dbCount:dbCount};
})();
</script>
</body>
</html>
