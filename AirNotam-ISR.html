<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AirNotam-ISR">

<title>AirNotam-ISR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;--paper-line:rgba(28,61,110,.055);
  --ink:#1c3d6e;--ink-dark:#0e2348;--ink-body:#1a1308;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-deep:#8a6a2a;--gold-lite:#d4b878;
  --asphalt:#2a2218;--cleared:#1f6f3f;--cleared2:#2d8a52;--stamp-red:#b94a3a;--amber:#f59e0b;
  --font-ui:'IBM Plex Sans Hebrew','Heebo',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Menlo','Courier New',monospace;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#1a1a1c;font-family:var(--font-ui);color:var(--ink-body);}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden;
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,var(--paper-line) 27px,var(--paper-line) 28px);}

/* ── HEADER (AirCheck flight-strip) ── */
.strip{flex-shrink:0;display:flex;align-items:center;padding:8px 14px;position:relative;
  background:var(--ink);color:var(--paper);font-family:var(--font-mono);
  box-shadow:0 3px 0 var(--ink-dark);position:relative;z-index:10;}
.strip-clock{display:flex;flex-direction:column;align-items:center;direction:ltr;flex-shrink:0;margin-inline-end:auto;}
.strip-clock-lbl{font-size:8px;opacity:.75;letter-spacing:.18em;text-transform:uppercase;line-height:1;}
.strip-clock-time{font-size:15px;font-weight:700;font-family:var(--font-mono);line-height:1;margin-top:3px;}
.strip-brand{font-family:var(--font-mono);font-size:15px;font-weight:700;letter-spacing:-.4px;
  direction:ltr;flex-shrink:0;}
.vtoggle{position:absolute;left:50%;transform:translateX(-50%);
  display:inline-flex;background:rgba(244,236,220,.12);border:1px solid rgba(244,236,220,.28);
  border-radius:20px;padding:2px;flex-shrink:0;}
.vtoggle button{border:none;background:transparent;color:rgba(244,236,220,.7);font-family:var(--font-ui);
  font-size:11px;font-weight:700;padding:5px 14px;border-radius:18px;cursor:pointer;transition:.15s;white-space:nowrap;}
.vtoggle button.on{background:var(--gold-lite);color:var(--ink-dark);}
.metabar{flex-shrink:0;padding:6px 14px;background:var(--paper-hi);border-bottom:1px solid var(--paper-edge);
  font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);direction:ltr;text-align:left;}
.metabar.err{color:var(--stamp-red);}
.stale-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:middle;}
.stale-fresh{background:#3fb950;box-shadow:0 0 5px #3fb950;}
.stale-aging{background:#e3a008;box-shadow:0 0 5px #e3a008;}
.stale-old{background:#f85149;box-shadow:0 0 6px #f85149;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.stale-warn{color:var(--stamp-red);font-weight:600;}

/* ── FILTER BAR (trigger) + CURTAIN ── */
#map{width:100%;flex:1;min-height:0;background:#aad3df;}
#map .leaflet-container{height:100%;font-family:var(--font-ui);}
.filterbar{flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:8px 12px 8px 16px;background:var(--paper-hi);border-bottom:1px solid var(--paper-edge);}
.fb-summary{flex:1;font-size:12px;font-family:var(--font-mono);color:var(--ink-muted);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;line-height:1.4;}
.fb-summary .fb-active{color:var(--gold-deep);font-weight:700;}
.fb-btn{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border:none;border-radius:20px;
  padding:7px 14px;font-family:var(--font-ui);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
.fb-btn:active{background:var(--ink-dark);}
.fb-cnt{background:var(--gold-lite);color:var(--ink-dark);border-radius:10px;padding:1px 7px;font-family:var(--font-mono);font-size:11px;}

/* stage holds result + curtain */
.stage{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.scrim{position:absolute;inset:0;background:rgba(14,35,72,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.scrim.open{opacity:1;pointer-events:auto;}
.curtain{position:absolute;top:0;left:0;right:0;z-index:50;width:100%;background:var(--paper-hi);
  border-radius:0 0 16px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);
  display:flex;flex-direction:column;overflow:hidden;
  max-height:0;transition:max-height .45s cubic-bezier(.4,0,.2,1);}
.curtain.open{max-height:var(--curtain-h,90%);}
.curtain-handle{width:36px;height:4px;border-radius:2px;background:var(--paper-edge);margin:8px auto 2px;flex-shrink:0;}
.curtain-body{overflow-y:auto;padding:10px 16px 4px;}
.curtain-foot{display:flex;gap:10px;padding:12px 16px;border-top:1.5px solid var(--paper-edge);background:var(--paper-hi);flex-shrink:0;}
.fa-apply{flex:1;background:var(--gold);color:var(--ink-dark);border:none;border-radius:var(--r);
  padding:13px;font-size:15px;font-weight:700;font-family:var(--font-ui);cursor:pointer;letter-spacing:.02em;}
.fa-apply:active{filter:brightness(.94);}
.fa-reset{background:var(--paper);color:var(--ink-muted);border:1px solid var(--paper-edge);border-radius:var(--r);
  padding:13px 18px;font-size:13px;font-family:var(--font-ui);cursor:pointer;}
.fa-reset:active{background:var(--paper-edge);}
.card-maplink{margin-inline-start:auto;background:none;border:1px solid var(--paper-edge);border-radius:var(--r);
  color:var(--ink);cursor:pointer;padding:3px 7px;font-size:14px;line-height:1;font-family:var(--font-ui);}
.card-maplink:active{background:var(--paper-edge);}
.c-foot{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:7px;direction:ltr;
  border-top:1px dashed var(--paper-edge);}
.c-foot .c-when{flex:1;text-align:left;}
.map-switch{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;cursor:pointer;user-select:none;}
.map-switch .ms-lbl{font-size:11px;font-weight:700;font-family:var(--font-ui);color:var(--cleared);white-space:nowrap;}
.ms-track{width:40px;height:22px;border-radius:12px;background:var(--cleared);position:relative;transition:.2s;flex-shrink:0;display:inline-block;}
.ms-track::after{content:"";position:absolute;top:2px;left:20px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.ms-track.off{background:#c3b596;}
.ms-track.off::after{left:2px;}
.card-dimmed{opacity:.5;filter:grayscale(.7);}
.card-dimmed .map-switch{opacity:1;filter:none;}
.card-dimmed .ms-lbl{color:var(--ink-faint);}
.f-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.f-row:last-child{margin-bottom:0;}
.f-lbl{font-size:9px;font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);min-width:74px;}
.srch{flex:1;min-width:150px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:var(--r);
  padding:9px 11px;font-size:14px;font-family:var(--font-ui);color:var(--ink-body);}
.srch:focus{outline:none;border-color:var(--gold);}
.chip{background:var(--paper);border:1px solid var(--paper-edge);border-radius:20px;padding:6px 12px;
  font-size:12px;font-family:var(--font-mono);cursor:pointer;color:var(--ink-muted);transition:all .12s;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.chip.pre.on{background:var(--gold-deep);border-color:var(--gold-deep);}

/* ── redesigned filter sections ── */
.f-search{margin-bottom:16px;}
.f-search .srch{width:100%;padding:11px 14px;font-size:14px;}
.fsec{margin-bottom:18px;}
.fsec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.fsec-num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-family:var(--font-mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fsec-title{font-size:15px;font-weight:700;color:var(--ink);}
.fsec-hint{font-size:11px;color:var(--ink-faint);margin-inline-start:auto;font-family:var(--font-mono);}
/* TIME segmented pills */
.seg{display:flex;gap:6px;}
.seg-btn{flex:1;padding:10px 6px;border:1.5px solid var(--paper-edge);border-radius:var(--r);background:var(--paper);
  cursor:pointer;text-align:center;font-size:13px;font-weight:700;color:var(--ink-body);font-family:var(--font-ui);}
.seg-btn .sub{display:block;font-size:10px;color:var(--ink-faint);font-weight:400;font-family:var(--font-mono);margin-top:2px;}
.seg-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.seg-btn.on .sub{color:var(--gold-lite);}
.manual-range{display:none;flex-direction:column;gap:8px;margin-top:10px;padding:12px;
  background:var(--paper);border:1.5px solid var(--paper-edge);border-radius:var(--r);}
.manual-range.open{display:flex;}
.manual-range label{display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--font-mono);color:var(--ink-muted);}
.manual-range .dtin{flex:1;padding:7px;border:1px solid var(--paper-edge);border-radius:4px;font-family:var(--font-mono);font-size:12px;}
/* REGION 2-button */
.region{display:flex;gap:6px;}
.region-btn{flex:1;padding:10px 8px;border:1.5px solid var(--paper-edge);border-radius:var(--r);background:var(--paper);
  cursor:pointer;text-align:center;font-family:var(--font-ui);transition:.12s;}
.region-btn .rn{font-size:14px;font-weight:700;color:var(--ink-body);}
.region-btn .rd{display:block;font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);margin-top:3px;}
.region-btn.on{background:var(--ink);border-color:var(--ink);}
.region-btn.on .rn{color:var(--paper);}
.region-btn.on .rd{color:var(--gold-lite);}
/* HEIGHT dropdown + checkbox */
.dd{width:100%;padding:11px 14px;border:1.5px solid var(--paper-edge);border-radius:var(--r);background:var(--paper);
  font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--ink-body);cursor:pointer;}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-muted);margin-top:10px;cursor:pointer;}
.chk input{width:15px;height:15px;accent-color:var(--ink);}
.adv{border:1.5px solid var(--paper-edge);border-radius:var(--r);overflow:hidden;background:var(--paper);margin-bottom:4px;}
.adv-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;}
.adv-head .ah-title{font-size:14px;font-weight:700;color:var(--ink-muted);}
.adv-head .ah-chev{margin-inline-start:auto;transition:transform .15s;color:var(--ink-faint);}
.adv.open .ah-chev{transform:rotate(180deg);}
.adv-body{display:none;padding:0 14px 14px;}
.adv.open .adv-body{display:block;}
.f-lbl2{font-size:11px;font-weight:700;color:var(--ink-faint);margin:12px 0 8px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-mono);}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.adv-tgl{margin-top:14px;}
.chip-admin{font-family:var(--font-mono);letter-spacing:.05em;border-style:dashed;color:var(--ink-faint);}
.chip-admin.on{background:var(--stamp-red);border-color:var(--stamp-red);border-style:solid;color:var(--paper);}
.numin{width:64px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:var(--r);
  padding:7px 8px;font-size:13px;font-family:var(--font-mono);color:var(--ink-body);text-align:center;}
.dtin{background:var(--paper);border:1px solid var(--paper-edge);border-radius:var(--r);
  padding:6px 8px;font-size:12px;font-family:var(--font-mono);color:var(--ink-body);}
.dtin:focus{outline:none;border-color:var(--gold);}
.tgl{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--ink-muted);}
.tgl input{width:15px;height:15px;accent-color:var(--ink);}
.unit{font-size:10px;font-family:var(--font-mono);color:var(--ink-faint);}

/* ── COUNT BAR ── */
.countbar{flex-shrink:0;padding:8px 16px;font-size:10px;font-family:var(--font-mono);
  color:var(--ink-muted);letter-spacing:.05em;background:var(--paper);border-bottom:1px solid var(--paper-line);}

/* ── LIST ── */
.list{flex:1;padding:12px 14px 20px;overflow-y:auto;}
.group{margin-bottom:20px;}
.g-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;font-family:var(--font-mono);
  letter-spacing:.05em;text-transform:uppercase;padding-bottom:6px;margin-bottom:10px;
  border-bottom:2px solid var(--gold-lite);color:var(--ink);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.g-now .dot{background:var(--cleared);} .g-soon .dot{background:var(--amber);} .g-later .dot{background:var(--ink-faint);}

.card{background:var(--paper-hi);border:1px solid var(--paper-edge);border-radius:var(--r);
  padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(28,61,110,.06);}
.card.now{border-inline-start:3px solid var(--cleared);}
.card.soon{border-inline-start:3px solid var(--amber);}
.c-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.c-id{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--ink-dark);}
.c-loc{font-family:var(--font-mono);font-size:12px;color:var(--ink);background:rgba(28,61,110,.08);
  padding:1px 6px;border-radius:4px;}
.b{font-size:9px;font-family:var(--font-mono);padding:2px 6px;border-radius:10px;
  border:1px solid var(--paper-edge);color:var(--ink-faint);}
.b.alt{border-color:var(--gold);color:var(--gold-deep);}
.b.admin{border-color:var(--stamp-red);color:var(--stamp-red);}
.b.cat{border-color:var(--ink);color:var(--ink);}
.b.rad{border-color:var(--ink-faint);}
.c-text{font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
  color:var(--ink-body);direction:ltr;text-align:left;margin-top:2px;}
.c-when{font-size:10px;font-family:var(--font-mono);color:var(--ink-muted);
  direction:ltr;text-align:left;}
.empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:30px 10px;}

/* ── FOOTER ── */
.footer-strip{flex-shrink:0;font-size:9px;font-family:var(--font-mono);color:var(--ink-faint);
  letter-spacing:.1em;text-transform:uppercase;direction:rtl;border-top:1px solid var(--gold-lite);
  background:var(--paper-hi);position:relative;padding:9px 14px;text-align:center;}
.footer-refresh{position:absolute;top:50%;left:14px;transform:translateY(-50%);
  font-size:11px;color:var(--ink-muted);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;opacity:.75;font-family:var(--font-ui);letter-spacing:.02em;}
.footer-refresh:active{opacity:.4;}
.disc{flex-shrink:0;font-size:9px;color:var(--ink-faint);padding:8px 16px;background:var(--paper);
  border-top:1px solid var(--paper-line);line-height:1.5;}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div id="app">

  <div class="strip">
    <div class="strip-brand">AirNotam-ISR</div>
    <div class="vtoggle">
      <button class="on" id="vList" onclick="setView('list')">רשימה</button>
      <button id="vMap" onclick="setView('map')">מפה</button>
    </div>
    <div class="strip-clock">
      <span class="strip-clock-lbl">UTC</span>
      <span class="strip-clock-time" id="utc">--:--</span>
    </div>
  </div>
  <div class="metabar hdr-meta" id="meta">טוען…</div>

  <div class="filterbar" id="filterbar">
    <span class="fb-summary" id="fbSummary">מסננים</span>
    <button class="fb-btn" id="fbBtn" onclick="toggleCurtain()">⚙ סינון <span class="fb-cnt" id="applyCount">—</span></button>
  </div>

  <div class="stage" id="stage">
    <div class="countbar" id="count"></div>
    <div class="list" id="list"></div>
    <div id="map" style="display:none;"></div>

    <div class="scrim" id="scrim" onclick="closeCurtain()"></div>
    <div class="curtain" id="curtain">
      <div class="curtain-handle"></div>
      <div class="curtain-body">
        <div class="f-search">
          <input class="srch" id="search" type="text" placeholder="🔍  חיפוש חופשי — טקסט / מספר NOTAM / ICAO…" autocomplete="off">
        </div>

        <!-- TIME -->
        <div class="fsec">
          <div class="fsec-head"><span class="fsec-title">מתי?</span><span class="fsec-hint">זמן</span></div>
          <div class="seg" id="timeSeg">
            <button class="seg-btn on" data-time="72">72 שעות<span class="sub">מעכשיו</span></button>
            <button class="seg-btn" data-time="range">טווח<span class="sub">תאריכים</span></button>
            <button class="seg-btn" data-time="all">הכל<span class="sub">ללא סינון</span></button>
          </div>
          <div class="manual-range" id="manualRange">
            <label>מ־ <input class="dtin" id="fromDT" type="datetime-local"></label>
            <label>עד <input class="dtin" id="tillDT" type="datetime-local"></label>
          </div>
        </div>

        <!-- REGION -->
        <div class="fsec">
          <div class="fsec-head"><span class="fsec-title">איפה?</span><span class="fsec-hint">אזור</span></div>
          <div class="region" id="regionSeg">
            <button class="region-btn on" data-region="north"><span class="rn">צפון</span><span class="rd">מאשדוד וצפונה</span></button>
            <button class="region-btn on" data-region="south"><span class="rn">דרום</span><span class="rd">מתל־יונה ודרומה</span></button>
          </div>
        </div>

        <!-- ALTITUDE -->
        <div class="fsec">
          <div class="fsec-head"><span class="fsec-title">גובה</span><span class="fsec-hint">תקרה</span></div>
          <select class="dd" id="altSel">
            <option value="0">ללא הגבלת גובה</option>
            <option value="1000">עד 1,000ft</option>
            <option value="3000">עד 3,000ft</option>
            <option value="5000">עד 5,000ft</option>
            <option value="10000">עד 10,000ft</option>
          </select>
          <label class="chk"><input type="checkbox" id="showUnknownAlt" checked> כלול NOTAM ללא גובה מוגדר</label>
        </div>

        <!-- ADVANCED -->
        <div class="adv" id="adv">
          <div class="adv-head" id="advHead"><span class="ah-title">⚙ מסננים מתקדמים</span><span class="ah-chev">▾</span></div>
          <div class="adv-body">
            <div class="f-lbl2">שדות תעופה</div>
            <span id="fields" class="chips-wrap"></span>
            <div class="f-lbl2">קטגוריה</div>
            <span id="cats" class="chips-wrap"></span>
          </div>
        </div>
      </div>
      <div class="curtain-foot">
        <button class="fa-reset" id="filterReset" onclick="resetFilters()">איפוס</button>
        <button class="fa-apply" id="filterApply" onclick="closeCurtain()">הצג <span id="applyCount2"></span> תוצאות</button>
      </div>
    </div>
  </div>

  <div class="disc" id="disc"></div>
  <div class="footer-strip">
    <span class="footer-refresh" onclick="load()">רענון</span>
    <span>AirNotam-ISR · v1.02.019 · built by eligrt</span>
  </div>
</div>

<script>
const FEED="https://raw.githubusercontent.com/eligrt/AirNotam-ISR/main/notams.json";
const FIELDS=["LLRS","LLMG","LLLL","LLBG","LLER","LLHA"];
// Q-code (chars 2-3 of qcode) -> friendly category. First letter after Q groups it.
const CATS=[
  ["route","נתיב/מרחב",["QAR","QAE","QAC","QAN","QAL","QAT"]],  // airspace/routes
  ["ad","שדה/מסלול",["QFA","QMR","QMX","QLP","QLC","QIS","QIC"]],// aerodrome/runway/ILS
  ["navaid","עזרי ניווט",["QND","QNM","QNL","QNV","QNB"]],       // navaids
  ["obstacle","מכשולים",["QOB","QOL","QOA","QOT"]],              // obstacles/other ops
  ["warning","אזהרות",["QW"]],                                   // W... nav warnings (PJE/UAS/fire/frng)
  ["comms","תקשורת",["QCA","QCC","QSE","QSA"]],                  // comms/radar/services
  ["gnss","GNSS",["QGW","QGA"]],                                 // GNSS
];
function catOf(qcode){
  if(!qcode)return "other";
  const q3=qcode.slice(0,3), q2=qcode.slice(0,2);
  for(const [key,,codes] of CATS){
    for(const c of codes){ if(c.length===2? q2===c : q3===c) return key; }
  }
  return "other";
}
function catLabel(key){const f=CATS.find(c=>c[0]===key);return f?f[1]:"אחר";}

let ALL=[];
// Deselect-to-hide model: pills start ON (shown); toggling one OFF adds it to a hidden set.
const hiddenFields=new Set();  // field codes the user has turned OFF
const hiddenCats=new Set();    // category keys the user has turned OFF
let showAdmin=false;           // ADMIN chip: starts OFF (admin hidden); ON shows admin NOTAMs
const regionOn=new Set(["north","south"]); // both halves on by default = whole country
let timeMode="72";             // "72" (next 72h) | "range" (manual dates) | "all"
const hiddenNotams=new Set();  // session-only: NOTAM ids the user dismissed (greyed in list, gone from map)
// region boundaries (lat °N) with overlap so nothing on the line is missed
const REGION={ north:31.79 /* Ashdod */, south:31.97 /* TYONA תל־יונה */ };

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// enrich straight from feed fields — no more raw-text guessing
function enrich(n){
  const q=n.qLine||{};
  const lowerFt = q.lowerLimitFl!=null? parseInt(q.lowerLimitFl,10)*100 : null;
  const upperFt = q.upperLimitFl!=null? parseInt(q.upperLimitFl,10)*100 : null;
  return {
    raw:n,
    id:n.id||"—",
    loc:n.location||"", airfield:n.airfield||"",
    text:n.eText||n.rawText||"",
    lowerFt, upperFt,
    lowerStr:n.lowerLimit, upperStr:n.upperLimit, // human strings when present
    radiusNm: n.position?.radiusNm ?? q.position?.radiusNm ?? null,
    lat: n.position?.lat ?? q.position?.lat ?? null,
    lon: n.position?.lon ?? q.position?.lon ?? null,
    start: n.fromDate? new Date(n.fromDate):null,
    end: n.toDate? new Date(n.toDate):null,
    admin: !!n.administrative,
    type: n.notamType||"", replaces: n.replaces||null,
    cat: catOf(q.qcode), qcode:q.qcode||""
  };
}
function isActiveNow(e,now){return(!e.start||e.start<=now)&&(!e.end||e.end>now);}
function timeGroup(e,now){if(isActiveNow(e,now))return"now";if(e.start&&e.start>now)return"soon";return"later";}
function fmtUTC(d){return d?d.toISOString().slice(0,16).replace("T"," ")+"Z":"—";}

function passFilters(e,now){
  const q=document.getElementById("search").value.trim().toLowerCase();
  if(q && !e.text.toLowerCase().includes(q) && !e.id.toLowerCase().includes(q)
       && !JSON.stringify(e.raw).toLowerCase().includes(q)) return false;

  if(!showAdmin && e.admin) return false;

  // fields: NOTAM shows unless every field it matches is turned OFF.
  // A NOTAM matching no listed field is governed by the "other" pill.
  const hay=(e.loc+" "+e.airfield+" "+e.text).toUpperCase();
  const matched=FIELDS.filter(f=>hay.includes(f));
  if(matched.length){
    const anyOn=matched.some(f=>!hiddenFields.has(f));
    if(!anyOn)return false;
  }else{
    if(hiddenFields.has("__other__"))return false;
  }

  // category: hidden if its category pill is OFF. "other" cat uses the other pill.
  const catKey=(e.cat&&e.cat!=="other")?e.cat:"__other__";
  if(hiddenCats.has(catKey))return false;

  // region: two overlapping halves (both on = whole country). A coord-bearing
  // NOTAM shows if it falls in ANY enabled half. No-coord NOTAMs always pass.
  // Both off is treated as "show all" (no empty screen).
  if(regionOn.size===1 && e.lat!=null){
    const inN=e.lat>=REGION.north, inS=e.lat<=REGION.south;
    const visible=(regionOn.has("north")&&inN)||(regionOn.has("south")&&inS);
    if(!visible)return false;
  }

  // time
  if(timeMode==="range"){
    const fv=document.getElementById("fromDT").value, tv=document.getElementById("tillDT").value;
    const from=fv?new Date(fv):null, till=tv?new Date(tv):null;
    const s=e.start||new Date(-8.64e15), en=e.end||new Date(8.64e15);
    if(from&&en<from)return false;
    if(till&&s>till)return false;
  }else if(timeMode==="72"){
    const horizon=new Date(now.getTime()+72*3600*1000);
    const startsInWindow=e.start&&e.start<=horizon;
    if(!isActiveNow(e,now)&&!startsInWindow)return false;
    if(e.end&&e.end<now)return false;
  } // "all" → no time filter

  // altitude (dropdown ceiling; 0 = no limit)
  const ceil=parseInt(document.getElementById("altSel").value,10)||0;
  if(ceil>0){
    if(e.lowerFt==null){if(!document.getElementById("showUnknownAlt").checked)return false;}
    else if(e.lowerFt>ceil)return false;
  }
  return true;
}

function render(){
  const now=new Date();
  const items=ALL.map(enrich).filter(e=>passFilters(e,now));
  LAST_ITEMS=items;
  const groups={now:[],soon:[],later:[]};
  items.forEach(e=>groups[timeGroup(e,now)].push(e));
  Object.values(groups).forEach(g=>g.sort((a,b)=>(a.start||0)-(b.start||0)));

  const nHidden=items.filter(e=>hiddenNotams.has(e.id)).length;
  document.getElementById("count").textContent=
    `${items.length}/${ALL.length} · פעיל כעת ${groups.now.length} · צפוי ${groups.soon.length}`
    + (nHidden? ` · ${nHidden} מוסתרים` : "");
  updateFilterSummary(items.length);

  const G=[["now","g-now","פעיל כעת"],["soon","g-soon","צפוי"],["later","g-later","אחר"]];
  const html=G.map(([k,cls,title])=>{
    if(!groups[k].length)return"";
    return`<div class="group ${cls}"><div class="g-head"><span class="dot"></span>${title} · ${groups[k].length}</div>`
      +groups[k].map(e=>card(e,k)).join("")+`</div>`;
  }).join("");
  document.getElementById("list").innerHTML=html||'<div class="empty">אין NOTAMs התואמים לסינון</div>';

  if(currentView==="map") renderMap();
}

// ── Map mode ──
let MAP=null, MAP_LAYER=null, MAP_NOTE=null, LAST_ITEMS=[], currentView="list";
let MAP_INDEX={}; // id -> {lat,lon,openPopup:fn}

function toggleHidden(id){
  hiddenNotams.has(id)? hiddenNotams.delete(id) : hiddenNotams.add(id);
  render();                       // re-render list (grey/un-grey) + map (drop/redraw)
}

function focusOnMap(id){
  closeCurtain();
  setView("map");
  const go=()=>{
    const hit=MAP_INDEX[id];
    if(!hit){ return; }
    MAP.setView([hit.lat,hit.lon], 11, {animate:true});
    hit.openPopup();
  };
  MAP? setTimeout(go,60) : setTimeout(go,300);
}

function setView(v){
  currentView=v;
  const isMap=v==="map", isList=v==="list";
  document.getElementById("list").style.display = isList? "block":"none";
  document.getElementById("map").style.display  = isMap? "block":"none";
  document.getElementById("count").style.display= isList? "block":"none";
  document.getElementById("vList").classList.toggle("on", isList);
  document.getElementById("vMap").classList.toggle("on", isMap);
  if(isMap){ initMap(); renderMap(); }
}

// ── Curtain (filter) ──
function openCurtain(){
  const cur=document.getElementById("curtain");
  const stage=document.getElementById("stage").getBoundingClientRect();
  cur.style.setProperty("--curtain-h", Math.round(stage.height*0.96)+"px");
  cur.classList.add("open");
  document.getElementById("scrim").classList.add("open");
}
function closeCurtain(){
  document.getElementById("curtain").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}
function toggleCurtain(){
  document.getElementById("curtain").classList.contains("open")?closeCurtain():openCurtain();
}

function resetFilters(){
  hiddenFields.clear(); hiddenCats.clear(); showAdmin=false;
  regionOn.clear(); regionOn.add("north"); regionOn.add("south");
  timeMode="72";
  document.getElementById("search").value="";
  document.querySelectorAll("#timeSeg .seg-btn").forEach(b=>b.classList.toggle("on",b.dataset.time==="72"));
  document.getElementById("manualRange").classList.remove("open");
  document.getElementById("fromDT").value=""; document.getElementById("tillDT").value="";
  document.querySelectorAll("#regionSeg .region-btn").forEach(b=>b.classList.add("on"));
  document.getElementById("altSel").value="0";
  document.getElementById("showUnknownAlt").checked=true;
  document.querySelectorAll("#fields .chip,#cats .chip").forEach(c=>c.classList.add("on"));
  const ac2=document.getElementById("adminChip"); if(ac2) ac2.classList.remove("on");
  render();
}

function initMap(){
  if(typeof L==="undefined"){
    document.getElementById("map").innerHTML=
      '<div style="padding:2rem;text-align:center;color:#5a4a3a;font-family:monospace">מפה לא זמינה (Leaflet לא נטען — בדוק חיבור)</div>';
    return;
  }
  if(MAP) { setTimeout(()=>MAP.invalidateSize(), 50); return; }
  MAP = L.map("map", { center:[31.5, 35.0], zoom:7, zoomControl:true });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom:19, subdomains:"abcd",
    attribution:"© OpenStreetMap © CARTO"
  }).addTo(MAP);
  MAP_LAYER = L.layerGroup().addTo(MAP);
  setTimeout(()=>MAP.invalidateSize(), 50);
}

function renderMap(){
  if(!MAP) return;
  MAP_LAYER.clearLayers();
  MAP_INDEX={};
  const now=new Date();
  const colorFor = e => {
    if(isActiveNow(e,now)) return "#1f6f3f";      // active = green
    if(e.start&&e.start>now) return "#e3a008";    // upcoming = amber
    return "#8a7a5a";
  };
  // Group NOTAMs that share (almost) the same center, so one click shows all.
  const groups={};
  let plotted=0;
  LAST_ITEMS.forEach(e=>{
    if(e.lat==null||e.lon==null) return;
    if(hiddenNotams.has(e.id)) return;   // dismissed NOTAMs are not drawn
    const key=`${e.lat.toFixed(3)},${e.lon.toFixed(3)}`; // ~100m bucket
    (groups[key]=groups[key]||[]).push(e);
    plotted++;
  });

  Object.values(groups).forEach(list=>{
    // draw a circle per NOTAM (so different radii still show), but bind ONE
    // popup listing every NOTAM at this location to whichever we click.
    const anyActive = list.some(e=>isActiveNow(e,now));
    const anySoon = list.some(e=>e.start&&e.start>now);
    const col = anyActive? "#1f6f3f" : anySoon? "#e3a008" : "#8a7a5a";
    const popupHtml = `<div style="max-height:220px;overflow:auto">`
      + `<b>${list.length>1?list.length+" NOTAMs כאן":"NOTAM"}</b>`
      + list.map(e=>{
          const alt=(e.lowerStr||e.upperStr)?`${e.lowerStr||"?"}–${e.upperStr||"?"}`
            :(e.lowerFt!=null?`${e.lowerFt}–${e.upperFt==null?'?':e.upperFt}ft`:"גובה ?");
          const ph=hiddenNotams.has(e.id);
          return `<div style="margin-top:6px">`
            +`<div style="display:flex;align-items:center;gap:8px;padding-bottom:5px;border-bottom:1px solid #ddd">`
              +`<b style="flex:1">${esc(e.id)}</b>`
              +`<label class="map-switch"><span class="ms-lbl">הצג במפה</span>`
              +`<span class="ms-track${ph?' off':''}" onclick="toggleHidden('${esc(e.id)}')"></span></label>`
            +`</div>`
            +`<div style="padding-top:5px">`
              +`<small style="color:#555">${esc(e.loc||"")}</small><br>`
              +`<span style="font-family:monospace;font-size:11px">${esc(e.text.slice(0,160))}</span><br>`
              +`<small>${esc(alt)} · ${fmtUTC(e.start)}→${fmtUTC(e.end)}</small>`
            +`</div></div>`;
        }).join("")
      + `</div>`;

    // sort so the largest circle is drawn first (smaller on top, all clickable)
    list.slice().sort((a,b)=>(b.radiusNm||0.5)-(a.radiusNm||0.5)).forEach(e=>{
      const radiusM=(e.radiusNm||0.5)*1852;
      const circle=L.circle([e.lat,e.lon],{radius:radiusM,color:col,weight:2,fillColor:col,fillOpacity:0.12});
      circle.bindPopup(popupHtml,{maxWidth:280});
      circle.addTo(MAP_LAYER);
    });
    // a small center dot to guarantee a reliable click target when circles overlap
    const c=list[0];
    const dot=L.circleMarker([c.lat,c.lon],{radius:4,color:col,fillColor:col,fillOpacity:1,weight:1})
      .bindPopup(popupHtml,{maxWidth:280}).addTo(MAP_LAYER);
    // let any card in this group jump here and open the shared popup
    list.forEach(e=>{ MAP_INDEX[e.id]={lat:c.lat,lon:c.lon,openPopup:()=>dot.openPopup()}; });
  });

  const missing = LAST_ITEMS.length - plotted;
  if(MAP_NOTE){ MAP.removeControl(MAP_NOTE); MAP_NOTE=null; }
  MAP_NOTE=L.control({position:"bottomleft"});
  MAP_NOTE.onAdd=function(){const d=L.DomUtil.create("div");
    d.style.cssText="background:rgba(255,255,255,.85);padding:3px 7px;border-radius:5px;font-size:11px;font-family:monospace";
    d.textContent=`${plotted} על המפה${missing>0?" · "+missing+" ללא מיקום":""}`;return d;};
  MAP_NOTE.addTo(MAP);
}



function card(e,k){
  const altTxt = (e.lowerStr||e.upperStr)
    ? `${e.lowerStr||"?"}–${e.upperStr||"?"}`
    : (e.lowerFt!=null? `${e.lowerFt}–${e.upperFt==null?'?':e.upperFt} ft` : "גובה ?");
  const alt=`<span class="b alt">${esc(altTxt)}</span>`;
  const rad=e.radiusNm!=null?`<span class="b rad">r=${e.radiusNm}NM</span>`:"";
  const cat=`<span class="b cat">${esc(catLabel(e.cat))}</span>`;
  const admin=e.admin?`<span class="b admin">ADMIN</span>`:"";
  const repl=e.type==="R"&&e.replaces?`<span class="b">↻ ${esc(e.replaces)}</span>`:"";
  const hasGeo=e.lat!=null&&e.lon!=null;
  const mapBtn=hasGeo?`<button class="card-maplink" title="הצג במפה" onclick="focusOnMap('${esc(e.id)}')">⌖</button>`:"";
  const hidden=hiddenNotams.has(e.id);
  const mapSwitch=`<label class="map-switch" title="${hidden?'מוסתר מהמפה':'מוצג במפה'}">
    <span class="ms-lbl">הצג במפה</span>
    <span class="ms-track${hidden?' off':''}" onclick="toggleHidden('${esc(e.id)}')"></span>
  </label>`;
  return`<div class="card ${k}${hidden?' card-dimmed':''}">
    <div class="c-head"><span class="c-id">${esc(e.id)}</span>
      ${e.loc?`<span class="c-loc">${esc(e.loc)}${e.airfield?" · "+esc(e.airfield):""}</span>`:""}
      ${cat}${alt}${rad}${admin}${repl}${mapBtn}</div>
    <div class="c-text">${esc(e.text)}</div>
    <div class="c-foot"><span class="c-when">${fmtUTC(e.start)} → ${fmtUTC(e.end)}</span>${mapSwitch}</div>
  </div>`;
}

function updateFilterSummary(shown){
  const parts=[];
  const q=document.getElementById("search").value.trim();
  if(q) parts.push('"'+q+'"');
  // time
  if(timeMode==="range") parts.push("טווח");
  else if(timeMode==="all") parts.push("כל הזמנים");
  else parts.push("72 שעות");
  // region
  if(regionOn.size===1) parts.push(regionOn.has("north")?"צפון":"דרום");
  else parts.push("כל הארץ");
  // altitude
  const ceil=parseInt(document.getElementById("altSel").value,10)||0;
  parts.push(ceil>0? "≤"+ceil.toLocaleString()+"ft" : "כל הגבהים");
  if(hiddenFields.size) parts.push("−"+[...hiddenFields].map(f=>f==="__other__"?"אחר":f).join(","));
  if(hiddenCats.size) parts.push("−"+[...hiddenCats].map(k=>k==="__other__"?"אחר":catLabel(k)).join(","));
  if(showAdmin) parts.push("ADMIN");
  document.getElementById("fbSummary").innerHTML = `<span class="fb-active">${esc(parts.join(" · "))}</span>`;
  const ac=document.getElementById("applyCount"); if(ac) ac.textContent=shown;
  const ac2=document.getElementById("applyCount2"); if(ac2) ac2.textContent=shown;
}

function buildChips(){
  const fb=document.getElementById("fields");
  const addField=(code,label)=>{const el=document.createElement("span");el.className="chip on";el.textContent=label;
    el.onclick=()=>{const off=el.classList.toggle("on")===false;
      off?hiddenFields.add(code):hiddenFields.delete(code);render();};fb.appendChild(el);};
  FIELDS.forEach(f=>addField(f,f));
  addField("__other__","אחר");

  const cb=document.getElementById("cats");
  const addCat=(key,label)=>{const el=document.createElement("span");el.className="chip on";el.textContent=label;
    el.onclick=()=>{const off=el.classList.toggle("on")===false;
      off?hiddenCats.add(key):hiddenCats.delete(key);render();};cb.appendChild(el);};
  CATS.forEach(([key,label])=>addCat(key,label));
  addCat("__other__","אחר");

  // ADMIN chip: starts OFF (admin hidden); ON shows admin NOTAMs
  const ael=document.createElement("span");ael.className="chip chip-admin";ael.id="adminChip";ael.textContent="ADMIN";
  ael.onclick=()=>{showAdmin=!showAdmin;ael.classList.toggle("on",showAdmin);render();};
  cb.appendChild(ael);
}
function prefillManual(){
  const f=document.getElementById("fromDT"),t=document.getElementById("tillDT");
  if(f.value&&t.value)return;
  const pad=n=>String(n).padStart(2,"0");
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const now=new Date();f.value=fmt(now);t.value=fmt(new Date(now.getTime()+24*3600*1000));
}

// search + toggles
document.getElementById("search").addEventListener("input",render);
document.getElementById("showUnknownAlt").addEventListener("change",render);
document.getElementById("altSel").addEventListener("change",render);

// TIME segmented (72 / range / all)
document.querySelectorAll("#timeSeg .seg-btn").forEach(b=>b.addEventListener("click",()=>{
  timeMode=b.dataset.time;
  document.querySelectorAll("#timeSeg .seg-btn").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const mr=document.getElementById("manualRange");
  if(timeMode==="range"){mr.classList.add("open");prefillManual();}else{mr.classList.remove("open");}
  render();
}));
["fromDT","tillDT"].forEach(id=>document.getElementById(id).addEventListener("input",render));

// REGION: two independent halves, both on by default. Toggling flips membership.
document.querySelectorAll("#regionSeg .region-btn").forEach(b=>b.addEventListener("click",()=>{
  const k=b.dataset.region;
  if(regionOn.has(k)){
    // don't allow the last one off into a weird empty state — turning the 2nd off
    // is allowed and treated as "all" by passFilters, so just toggle freely.
    regionOn.delete(k);
  }else{
    regionOn.add(k);
  }
  b.classList.toggle("on",regionOn.has(k));
  render();
}));

// ADVANCED accordion
document.getElementById("advHead").addEventListener("click",()=>
  document.getElementById("adv").classList.toggle("open"));

async function load(){
  const meta=document.getElementById("meta");meta.textContent="טוען…";meta.className="metabar";
  try{
    const res=await fetch(FEED,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();ALL=data.notams||[];
    const gen=data.generatedAt?new Date(data.generatedAt):null;
    meta.innerHTML=staleLine(gen,data.count??ALL.length);
    document.getElementById("disc").textContent=
      "⚠️ כלי עזר בלבד — אמת מול תדריך NOTAM רשמי לפני כל טיסה. מקור: IAA (איסוף עצמאי). "+(data.disclaimer||"");
    render();
  }catch(e){meta.className="metabar err";meta.textContent="LOAD ERROR: "+e.message;}
}

// age judged by generatedAt (when scraped), NOT by fetch time
function staleLine(gen,count){
  if(!gen) return `SRC: IAA official (own scraper) · ${count} · <span class="stale-warn">⚠ עדכון לא ידוע</span>`;
  const mins=Math.round((Date.now()-gen.getTime())/60000);
  let cls,txt;
  // scrape cadence is ~2h (GitHub cron throttles tight intervals), so
  // "fresh" spans a normal cycle + slack; only flag red when clearly stalled.
  if(mins<150){cls="stale-fresh";txt="עדכני";}
  else if(mins<300){cls="stale-aging";txt="מתיישן";}
  else{cls="stale-old";txt="ישן — בדוק מקור רשמי!";}
  const ago = mins<60? `${mins} דק'` : `${Math.floor(mins/60)}ש ${mins%60}דק'`;
  const when=gen.toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  return `<span class="stale-dot ${cls}"></span>SRC: IAA official (own scraper) · ${count} · `
       + `<span class="${cls==='stale-old'?'stale-warn':''}">גובּה לפני ${ago} (${when}) · ${txt}</span>`;
}

function tickUTC(){const d=new Date();const p=n=>String(n).padStart(2,"0");
  const el=document.getElementById("utc");if(el)el.textContent=p(d.getUTCHours())+":"+p(d.getUTCMinutes());}
tickUTC();setInterval(tickUTC,1000);
buildChips();setView("list");load();
</script>
